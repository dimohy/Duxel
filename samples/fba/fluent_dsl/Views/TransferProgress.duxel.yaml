schema: 1
screen: TransferProgress
using: [Fluent, Dux]

state:
  Completion: { type: float, initial: 35 }
  Status: Move the slider to simulate a transfer.

view:
  Column:
    spacing: 12
    children:
      - Text:
          style: Title2
          text: Transfer progress
      - SizedBox:
          width: 360
          child:
            Slider:
              label: Transfer completion
              value: { bind: Completion }
              minimum: 0
              maximum: 100
              step: 2.5
      - SizedBox:
          width: 360
          child:
            ProgressBar:
              value: { read: Completion }
              maximum: 100
              height: 4
      - Row:
          spacing: 8
          children:
            - Button:
                label: Record progress
                onClick: Apply
            - Button:
                label: Reset progress
                onClick: ResetProgress
      - Text:
          text: { read: Status }
